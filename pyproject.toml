[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secrl-prune"
version = "0.1.0"
description = "SecRL-Prune: structured reinforcement-learning-based FFN channel pruning for CodeLLMs."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Parsa Memarzadeh"}
]
dependencies = [
  "torch>=2.1",
  "transformers>=4.40",
  "accelerate>=0.30",
  "tqdm>=4.66",
  "safetensors>=0.4",
  "sentencepiece>=0.2",
  "protobuf>=4.25"
]

[tool.setuptools.packages.find]
include = ["secrl_prune*"]
